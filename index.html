<!DOCTYPE html>
<html lang="es">

      box-sizing: border-box;

    body {
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: url("11.jpg") no-repeat center center fixed;
      background-size: cover;
      padding: 20px;
    }

    .capa-sombra {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.2); z-index: -1;
    }

    .caja-login {
      background: url("13.jpg") no-repeat center center;
      background-size: cover;
      border-radius: 24px; padding: 0 30px 35px 30px;
      width: 100%; max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      overflow: hidden; position: relative;
    }

    .caja-login::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.75); z-index: 0; pointer-events: none;
    }

    .caja-login > * { position: relative; z-index: 1; }

    .banner {
      width: 100%; height: 180px; margin-bottom: 25px; overflow: hidden;
    }
    .banner img { width: 100%; height: 100%; object-fit: cover; }

    h2 {
      text-align: center; color: #2c3e50; margin-bottom: 25px;
      font-size: 24px; font-weight: 700; letter-spacing: 1px;
    }

    .campo { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; color: #475569; font-weight: 600; font-size: 15px; }
    
    input {
      width: 100%; padding: 15px; border: 2px solid #e2e8f0;
      border-radius: 12px; font-size: 16px; color: #334155;
      background: rgba(255,255,255,0.9);
      transition: border 0.3s, box-shadow 0.3s;
    }
    input:focus { outline: none; border-color: #f472b6; box-shadow: 0 0 0 4px rgba(244,114,182,0.15); }

    button {
      width: 100%; padding: 15px;
      background: linear-gradient(90deg, #ff6b6b, #ee5a9a);
      color: white; border: none; border-radius: 12px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      letter-spacing: 0.5px;
    }
    button:hover { transform: scale(1.03); box-shadow: 0 8px 20px rgba(238,90,154,0.3); }

    .mensaje {
      margin-top: 15px; text-align: center; font-weight: 600;
      min-height: 24px; font-size: 15px;
    }
    .correcto { color: #16a34a; }
    .incorrecto { color: #dc2626; }
  </style>
</head>

<div class="capa-sombra"></div>

  <div class="banner">
    <img src="99.jpg" alt="Banner">
  </div>

  <form id="form-login">
    <div class="campo">
      <label for="usuario">Usuario</label>

    </div>

    <div class="campo">
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" placeholder="Escribe tu contraseña" required>
    </div>

    <button type="submit">Ingresar</button>

  <div id="mensaje" class="mensaje"></div>
</div>
