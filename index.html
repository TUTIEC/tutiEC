<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIEJO TAPIAS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #000000, #2c0000);
      min-height: 100vh;
    }
    .contenedor {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      color: white;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .subtitulo {
      color: #ffcc00;
      font-size: 20px;
      margin-bottom: 50px;
    }

    /* BOTÓN PRINCIPAL */
    .boton-suscribir {
      display: inline-block;
      background: #FF0000;
      color: white;
      font-size: 24px;
      font-weight: bold;
      padding: 20px 60px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: pulsar 2s infinite;
    }
    .boton-suscribir:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.9);
    }
    @keyframes pulsar {
      0% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
      50% { box-shadow: 0 0 35px rgba(255, 0, 0, 0.8); }
      100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
    }

    /* SECCIÓN DE CONFIRMACIÓN */
    .seccion-confirmacion {
      margin-top: 50px;
      display: none;
      animation: aparecer 0.8s ease;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .texto-gracias {
      color: #00FF00;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }
    .boton-confirmado {
      display: inline-block;
      background: #00CC00;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 18px 50px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
    }
    .boton-confirmado:hover {
      transform: scale(1.05);
    }
    .nota {
      color: #999;
      margin-top: 30px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>VIEJO TAPIAS</h1>
    <p class="subtitulo">🔥 33.2 K suscriptores — ¡Únete a la familia! 🔥</p>

    <!-- BOTÓN QUE ABRE Y MUESTRA CONFIRMACIÓN -->
    <button class="boton-suscribir" id="botonPrincipal" onclick="abrirSuscripcion()">
      ▶️ SUSCRIBIRSE AHORA
    </button>

    <div class="seccion-confirmacion" id="confirmacion">
      <p class="texto-gracias">✅ ¡GRACIAS POR APOYAR!</p>
      <p style="color:white; margin-bottom:20px;">Presiona "Suscribirse" en la ventana de YouTube 👆</p>
      <button class="boton-confirmado" onclick="yaSoy()">
        ✅ YA SOY SUSCRIPTOR
      </button>
    </div>

    <p class="nota">Al presionar se abre YouTube para confirmar ✅</p>
  </div>

  <script>
    function abrirSuscripcion() {
      // Abre YouTube en ventana pequeña
      window.open(
        'https://youtube.com/@viejotapias6360/subscribe',
        'Suscripcion',
        'width=600,height=400,top=100,left=100'
      );
      
      // Muestra el mensaje de confirmación en tu página
      document.getElementById('confirmacion').style.display = 'block';
      document.getElementById('botonPrincipal').style.opacity = '0.4';
      document.getElementById('botonPrincipal').disabled = true;
    }

    function yaSoy() {
      alert('🎉 ¡Gracias por ser parte de la familia VIEJO TAPIAS! 🎉');
    }
  </script>

</body>
</html>
