<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIEJO TAPIAS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #000000, #2c0000);
      min-height: 100vh;
    }
    .contenedor {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      color: white;
      font-size: 36px;
      margin-bottom: 10px;
    }
    .subtitulo {
      color: #cccccc;
      font-size: 18px;
      margin-bottom: 40px;
    }

    /* === BOTÓN SUSCRIBIRSE === */
    .boton-suscribir {
      display: inline-block;
      background: #FF0000;
      color: white;
      font-size: 22px;
      font-weight: bold;
      padding: 18px 50px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      transition: all 0.3s ease;
      animation: pulsar 2s infinite;
    }
    .boton-suscribir:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
    }
    @keyframes pulsar {
      0% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
      50% { box-shadow: 0 0 35px rgba(255, 0, 0, 0.8); }
      100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
    }

    /* === BOTÓN CONFIRMACIÓN === */
    .seccion-confirmacion {
      margin-top: 50px;
      display: none; /* Empieza oculto */
    }
    .seccion-confirmacion.activo {
      display: block;
      animation: aparecer 0.8s ease;
    }
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .texto-gracias {
      color: #00FF00;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .boton-confirmado {
      display: inline-block;
      background: #00CC00;
      color: white;
      font-size: 20px;
      font-weight: bold;
      padding: 15px 40px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
      border: none;
      cursor: pointer;
    }
    .boton-confirmado:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>VIEJO TAPIAS</h1>
    <p class="subtitulo">🔥 33.2 K suscriptores — ¡Únete a la familia! 🔥</p>

    <!-- BOTÓN PRINCIPAL -->
    <a href="https://youtube.com/@viejotapias6360/subscribe" 
       target="_blank" 
       class="boton-suscribir"
       id="botonSuscribir"
       onclick="mostrarConfirmacion()">
      ▶️ SUSCRIBIRSE AHORA
    </a>

    <!-- SECCIÓN QUE APARECE DESPUÉS -->
    <div class="seccion-confirmacion" id="seccionConfirmar">
      <p class="texto-gracias">✅ ¡GRACIAS POR SUSCRIBIRTE!</p>
      
      <button class="boton-confirmado" onclick="alert('🎉 ¡Bienvenido a la familia VIEJO TAPIAS! 🎉')">
        ✅ YA SOY SUSCRIPTOR
      </button>
    </div>
  </div>

  <script>
    function mostrarConfirmacion() {
      // Espera un momento y muestra la confirmación
      setTimeout(function() {
        document.getElementById('seccionConfirmar').classList.add('activo');
        document.getElementById('botonSuscribir').style.opacity = '0.5';
      }, 800);
    }
  </script>

</body>
</html>
