<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amor ❤️</title>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      margin: 0;
      font-family: sans-serif;
    }
    .boton-amor {
      padding: 20px 50px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      background: #e74c3c;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
      transition: transform 0.3s;
    }
    .boton-amor:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

<button class="boton-amor" onclick="alert('❤️ ¡Tú también! ❤️')">
  💖 Amor 💖
</button>

</body>
</html>
