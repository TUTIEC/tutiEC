<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️ Corazón</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }
    .corazon {
      font-size: 120px;
      cursor: pointer;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 6px 15px rgba(220, 50, 80, 0.4));
    }
    .corazon:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body>

<a href="amor.html" class="corazon">❤️</a>

</body>
</html>
